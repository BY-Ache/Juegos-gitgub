<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mario Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ff;--surface:#fff;--text:#1d1749;--muted:#5d5a85;--line:#d6d9f5;--accent:#ff4f8b;
--c1:#ff4f8b;--c2:#2bb673;--c3:#ffb000;--c4:#3d7bff;--c5:#8a5cff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f38;--surface:#221a57;--text:#f3f1ff;--muted:#aaa5da;--line:#3a3080}}
:root[data-theme="dark"]{--bg:#150f38;--surface:#221a57;--text:#f3f1ff;--muted:#aaa5da;--line:#3a3080}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1100px;margin:0 auto}
.logo{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0}
.logo span{display:inline-block;transform:rotate(-4deg);background:var(--accent);color:#fff;padding:0 10px;border-radius:10px;margin-right:4px}
input[type=search]{font:inherit;padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--text);min-width:min(260px,100%);flex:1;max-width:380px}
input:focus-visible,button:focus-visible,.card:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:0 20px 40px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px}
.tab{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--text);padding:6px 16px;border-radius:999px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{position:relative;border:0;border-radius:22px;aspect-ratio:1;color:#fff;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:18px}
.card:hover{transform:scale(1.05);border-radius:34px}
.card .ico{font-size:56px;line-height:1}
.card b{font-size:19px;font-weight:800}
.card small{opacity:.9;font-weight:700}
.card.soon{background:var(--surface)!important;color:var(--muted);border:2px dashed var(--line);cursor:default}
.card.soon:hover{transform:none;border-radius:22px}
.empty{color:var(--muted);padding:30px 0}
dialog{border:0;border-radius:24px;background:var(--surface);color:var(--text);padding:0;width:min(560px,96vw);max-height:96vh}
dialog::backdrop{background:rgba(10,6,40,.7)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:10px}
.bar h2{margin:0;font-size:22px;font-weight:800}
.x{font:inherit;font-weight:800;border:0;background:var(--line);color:var(--text);border-radius:999px;padding:6px 16px;cursor:pointer}
.stage{padding:0 18px 18px;text-align:center}
.score{font-weight:800;margin:0 0 8px;color:var(--muted)}
canvas{max-width:100%;border-radius:14px;background:#0f0a2e;touch-action:none}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:0 auto}
.mc{aspect-ratio:1;font-size:34px;border:0;border-radius:14px;background:var(--c4);color:#fff;cursor:pointer;font-family:inherit}
.mc.up{background:var(--bg)}
.mc.ok{background:var(--c2)}
.field{position:relative;height:300px;background:var(--bg);border-radius:14px;overflow:hidden}
.tg{position:absolute;width:54px;height:54px;border-radius:50%;border:0;background:var(--c3);font-size:28px;cursor:pointer}
.go{font:inherit;font-weight:800;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:10px 24px;margin-top:12px;cursor:pointer}
footer{text-align:center;color:var(--muted);padding:0 20px 30px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header>
  <h1 class="logo"><span>Mario</span>Arcade</h1>
  <input type="search" id="q" placeholder="Buscar juegos" aria-label="Buscar juegos">
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No hay juegos con ese nombre. Prueba con otra palabra.</p>
</main>
<footer>Añade más juegos en la lista GAMES del código.</footer>

<dialog id="dlg" aria-labelledby="dt">
  <div class="bar"><h2 id="dt"></h2><button class="x" id="close">Cerrar</button></div>
  <div class="stage" id="stage"></div>
</dialog>

<script>
const GAMES=[
 {id:'snake',name:'Serpiente',cat:'Arcade',ico:'🐍',col:'var(--c2)'},
 {id:'memory',name:'Memoria',cat:'Puzzle',ico:'🧠',col:'var(--c5)'},
 {id:'reflex',name:'Reflejos',cat:'Habilidad',ico:'🎯',col:'var(--c1)'},
 {id:'arkanoid',name:'Arkanoid',cat:'Arcade',ico:'🧱',col:'var(--c4)'},
 {id:'s1',name:'Próximamente',cat:'Arcade',ico:'🏎️',soon:1},
 {id:'s2',name:'Próximamente',cat:'Puzzle',ico:'🧩',soon:1}
];
const CATS=['Todos','Arcade','Puzzle','Habilidad'];
let cat='Todos',stop=null;
const $=s=>document.querySelector(s);

function render(){
  const q=$('#q').value.trim().toLowerCase();
  $('#tabs').innerHTML=CATS.map(c=>`<button class="tab" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join('');
  const list=GAMES.filter(g=>(cat==='Todos'||g.cat===cat)&&(!q||g.name.toLowerCase().includes(q)));
  $('#grid').innerHTML=list.map(g=>g.soon
   ?`<div class="card soon"><span class="ico">${g.ico}</span><b>${g.name}</b></div>`
   :`<button class="card" style="background:${g.col}" data-g="${g.id}"><span class="ico">${g.ico}</span><b>${g.name}</b><small>${g.cat}</small></button>`).join('');
  $('#empty').hidden=list.length>0;
}
$('#tabs').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
$('#grid').onclick=e=>{const b=e.target.closest('[data-g]');if(b)open(b.dataset.g)};
$('#q').oninput=render;

function open(id){
  const g=GAMES.find(x=>x.id===id);
  $('#dt').textContent=g.name;
  $('#stage').innerHTML='';
  $('#dlg').showModal();
  ({snake,memory,reflex,arkanoid})[id]($('#stage'));
}
function end(){if(stop)stop();stop=null;$('#stage').innerHTML=''}
$('#close').onclick=()=>$('#dlg').close();
$('#dlg').addEventListener('close',end);

/* Serpiente */
function snake(el){
  el.innerHTML='<p class="score">Puntos: <span id="sc">0</span> · Flechas o desliza</p><canvas id="cv" width="360" height="360"></canvas>';
  const cv=$('#cv'),x=cv.getContext('2d'),N=18,S=20;
  let s,d,nd,f,pts,t;
  function reset(){s=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];d=nd={x:1,y:0};pts=0;$('#sc').textContent=0;food()}
  function food(){do{f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(s.some(p=>p.x===f.x&&p.y===f.y))}
  function step(){
    d=nd;const h={x:s[0].x+d.x,y:s[0].y+d.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||s.some(p=>p.x===h.x&&p.y===h.y)){reset();return}
    s.unshift(h);
    if(h.x===f.x&&h.y===f.y){pts++;$('#sc').textContent=pts;food()}else s.pop();
    x.fillStyle='#0f0a2e';x.fillRect(0,0,360,360);
    x.font='18px serif';x.fillText('🍎',f.x*S,f.y*S+17);
    s.forEach((p,i)=>{x.fillStyle=i?'#2bb673':'#7dffc0';x.fillRect(p.x*S+1,p.y*S+1,S-2,S-2)});
  }
  const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  function key(e){const k=keys[e.key];if(k&&!(k[0]===-d.x&&k[1]===-d.y)){nd={x:k[0],y:k[1]};e.preventDefault()}}
  let sx,sy;
  cv.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};
  cv.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    const n=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};
    if(!(n.x===-d.x&&n.y===-d.y))nd=n};
  addEventListener('keydown',key);reset();t=setInterval(step,120);
  stop=()=>{clearInterval(t);removeEventListener('keydown',key)};
}

/* Memoria */
function memory(el){
  const em=['🍕','🚗','🐶','⚽','🎸','🌈','🍩','🚀'];
  const deck=[...em,...em].sort(()=>Math.random()-.5);
  let open=[],lock=false,moves=0,found=0;
  el.innerHTML='<p class="score">Movimientos: <span id="mv">0</span></p><div class="mem" id="m"></div>';
  const m=$('#m');
  m.innerHTML=deck.map((e,i)=>`<button class="mc" data-i="${i}" aria-label="Carta"></button>`).join('');
  m.onclick=ev=>{
    const b=ev.target.closest('.mc');if(!b||lock||b.classList.contains('up'))return;
    b.classList.add('up');b.textContent=deck[b.dataset.i];open.push(b);
    if(open.length===2){
      moves++;$('#mv').textContent=moves;
      const[a,c]=open;
      if(a.textContent===c.textContent){a.classList.add('ok');c.classList.add('ok');open=[];
        if(++found===8)el.insertAdjacentHTML('beforeend',`<p class="score">¡Lo conseguiste en ${moves} movimientos!</p>`)}
      else{lock=true;setTimeout(()=>{open.forEach(z=>{z.classList.remove('up');z.textContent=''});open=[];lock=false},700)}
    }
  };
}

/* Reflejos */
function reflex(el){
  el.innerHTML='<p class="score">Puntos: <span id="p">0</span> · Tiempo: <span id="t">20</span></p><div class="field" id="f"></div><button class="go" id="go">Empezar</button>';
  let p=0,t=20,iv;
  const f=$('#f');
  function spawn(){
    f.innerHTML='';const b=document.createElement('button');b.className='tg';b.textContent='🎯';b.setAttribute('aria-label','Objetivo');
    b.style.left=Math.random()*(f.clientWidth-54)+'px';b.style.top=Math.random()*(f.clientHeight-54)+'px';
    b.onclick=()=>{p++;$('#p').textContent=p;spawn()};f.appendChild(b);
  }
  $('#go').onclick=()=>{
    clearInterval(iv);p=0;t=20;$('#p').textContent=0;$('#t').textContent=20;spawn();
    iv=setInterval(()=>{t--;$('#t').textContent=t;if(t<=0){clearInterval(iv);f.innerHTML='<p style="padding-top:110px;font-weight:800;font-size:22px">¡Tiempo! Hiciste '+p+' puntos</p>';$('#go').disabled=false}},1000);
    $('#go').disabled=true;
    stop=()=>{clearInterval(iv)};
  };
}

/* Arkanoid */
function arkanoid(el){
  el.innerHTML = '<p class="score">Puntos: <span id="ascore">0</span> · Vidas: <span id="alives">3</span></p><canvas id="acv" width="480" height="320"></canvas>';
  const cv = $('#acv');
  const ctx = cv.getContext('2d');
  let W = cv.width, H = cv.height;
  // game state
  let paddle = {w:80,h:12,x: (W-80)/2, speed: 7};
  let ball = {x: W/2, y: H-60, r:8, vx:4, vy:-4};
  const rows = 5, cols = 8;
  const brickW = Math.floor((W - 40) / cols);
  const brickH = 18;
  let bricks = [];
  let score = 0, lives = 3, raf=0, left=false, right=false, running=true;

  function makeBricks(){
    bricks = [];
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        bricks.push({x:20 + c*(brickW+5), y:40 + r*(brickH+6), w:brickW, h:brickH, alive:true, hits:1});
      }
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // background
    ctx.fillStyle='#0f0a2e'; ctx.fillRect(0,0,W,H);
    // bricks
    bricks.forEach(b=>{
      if(!b.alive) return;
      ctx.fillStyle = '#3d7bff'; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#fff'; ctx.strokeRect(b.x, b.y, b.w, b.h);
    });
    // paddle
    ctx.fillStyle = '#ff4f8b'; ctx.fillRect(paddle.x, H - 40, paddle.w, paddle.h);
    // ball
    ctx.beginPath(); ctx.fillStyle = '#ffd166'; ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    // HUD handled by DOM
  }

  function resetBall(){
    ball.x = W/2; ball.y = H-80; ball.vx = 4*(Math.random()>0.5?1:-1); ball.vy = -4;
  }

  function step(){
    // move paddle
    if(left) paddle.x -= paddle.speed;
    if(right) paddle.x += paddle.speed;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    // move ball
    ball.x += ball.vx; ball.y += ball.vy;
    // wall collisions
    if(ball.x - ball.r < 0){ball.x = ball.r; ball.vx *= -1}
    if(ball.x + ball.r > W){ball.x = W - ball.r; ball.vx *= -1}
    if(ball.y - ball.r < 0){ball.y = ball.r; ball.vy *= -1}
    // paddle collision
    if(ball.y + ball.r > H - 40 && ball.y + ball.r < H - 40 + paddle.h && ball.x > paddle.x && ball.x < paddle.x + paddle.w){
      // reflect depending on hit position
      const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
      ball.vx = 5 * hit; ball.vy = -Math.abs(ball.vy);
    }
    // bottom (lose life)
    if(ball.y - ball.r > H){
      lives--; $('#alives').textContent = lives;
      if(lives<=0){ // game over
        running=false; endGame(false); return;
      } else { resetBall(); }
    }
    // bricks collisions
    for(let i=0;i<bricks.length;i++){
      const b = bricks[i];
      if(!b.alive) continue;
      if(ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h){
        b.alive = false; score += 10; $('#ascore').textContent = score;
        // simple reflect
        ball.vy *= -1; break;
      }
    }
    // win check
    if(bricks.every(b=>!b.alive)){ running=false; endGame(true); return; }
    draw();
    raf = requestAnimationFrame(step);
  }

  function endGame(win){
    cancelAnimationFrame(raf);
    const msg = win ? `¡Ganaste! Puntos: ${score}` : `Fin de juego. Puntos: ${score}`;
    const p = document.createElement('p'); p.style.fontWeight='800'; p.style.fontSize='18px'; p.style.paddingTop='12px'; p.textContent = msg;
    el.appendChild(p);
    stop = cleanup;
  }

  function cleanup(){
    running=false; cancelAnimationFrame(raf);
    removeListeners();
  }

  function resize(){
    // scale canvas to parent width while keeping ratio
    const parentW = cv.parentElement.clientWidth - 36; // account for padding
    const scale = Math.min(1, parentW / 480);
    cv.style.width = Math.floor(W * scale) + 'px';
  }

  function onKeyDown(e){ if(e.key==='ArrowLeft') left=true; if(e.key==='ArrowRight') right=true }
  function onKeyUp(e){ if(e.key==='ArrowLeft') left=false; if(e.key==='ArrowRight') right=false }
  function onMove(e){
    const rect = cv.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    // map to canvas coord
    const scale = cv.width / rect.width;
    paddle.x = cx*scale - paddle.w/2;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function addListeners(){
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    cv.addEventListener('mousemove', onMove);
    cv.addEventListener('touchstart', onMove);
    cv.addEventListener('touchmove', onMove);
    window.addEventListener('resize', resize);
  }
  function removeListeners(){
    window.removeEventListener('keydown', onKeyDown);
    window.removeEventListener('keyup', onKeyUp);
    cv.removeEventListener('mousemove', onMove);
    cv.removeEventListener('touchstart', onMove);
    cv.removeEventListener('touchmove', onMove);
    window.removeEventListener('resize', resize);
  }

  // init
  makeBricks(); resetBall(); $('#ascore').textContent = score; $('#alives').textContent = lives;
  addListeners(); resize(); draw(); raf = requestAnimationFrame(step);
  stop = cleanup;
}

render();
</script>
</body>
</html>
